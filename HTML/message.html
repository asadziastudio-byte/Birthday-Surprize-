<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Happy Birthday My Moon 🌙</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="/CSS/message.css">
<link rel="stylesheet" href="/CSS/global.css">
<link rel="stylesheet" href="/CSS/transitions.css">

</head>
<body>

<div class="ambient" id="ambient"></div>
<canvas id="stars"></canvas>
<div id="bubbleBg" class="bubble-bg"></div>

<div class="page">
  <div class="card" id="card">
    <div class="ornaments"><span></span></div>

    <div class="moon-wrap">
      <svg class="moon-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="mg" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#fde8f5"/>
            <stop offset="45%" stop-color="#e59ab8"/>
            <stop offset="85%" stop-color="#b06080"/>
            <stop offset="100%" stop-color="#6b3050"/>
          </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="36" fill="url(#mg)"/>
        <circle cx="63" cy="43" r="27" fill="rgba(10,8,20,.72)"/>
      </svg>
    </div>

    <h1 class="heading">Happy Birthday to My Moon</h1>
    <h1 class="heading">Nafeesa</h1>
    <p class="tagline">~ a letter from my heart to yours ~</p>

    <div class="divider">
      <div class="dline"></div>
      <div class="dicons"><span>🌸</span><span>💕</span><span>🌸</span></div>
      <div class="dline"></div>
    </div>

    <div class="letter">

  <div class="letter-block left">
    <img src="/doodles/d1.png" class="inline-doodle">

    <p class="typing-text"
   data-text="Happy Birthday to My Moon 🌙 Ever since you became a part of my life, everything feels softer and brighter.">
</p>
  </div>

  <div class="letter-block right">
    <img src="/doodles/d2.png" class="inline-doodle">

    <p class="typing-text"
      data-text='I love you <span class="love-name">Nafeesun</span> in ways I can’t always explain, but somehow every quiet moment reminds me of you.'>
    </p>
  </div>

  <div class="letter-block left">
    <img src="/doodles/d3.png" class="inline-doodle">

    <p class="typing-text"
      data-text= "Your smile,
      your warmth,
      your gentle presence —
      all of it feels like home to me.">
    </p>
  </div>

  <div class="letter-block right">
    <img src="/doodles/d4.png" class="inline-doodle">

    <p class="typing-text"
      data-text='And yes…
      I’m still obsessed with your cute nose, <span class="love-name">Nafeesun</span>😄'>
    </p>
  </div>

  <div class="letter-block center">
    <img src="/doodles/d5.png" class="inline-doodle center-doodle">

    <p class="typing-text"
      data-text="I wish I could give you
      every flower,
      every chocolate,
      every beautiful thing in the world.but even that wouldn’t be enough
       for someone as precious as you.">
    </p>
  </div>

  <div class="letter-block left">
    <img src="/doodles/d6.png" class="inline-doodle">

    <p class="typing-text"
      data-text="Thank you for being
      my favorite light
      in every dark moment.">
    </p>
  </div>

  <div class="letter-block right">
    <img src="/doodles/d7.png" class="inline-doodle">

    <p class="typing-text"
      data-text='I pray this year brings
      peace,
      happiness,
      and endless success to my <span class="love-name">Nafeesa Asad</span>'>
    </p>
  </div>

  <div class="letter-block left">
    <img src="/doodles/d8.png" class="inline-doodle">

   <p class="typing-text"
      data-text='Happy Birthday once again,
      my Dahlia,
      my moon.
      my <span class="love-name">Nafeesun</span>'>
    </p>
  </div>

  <div class="letter-block center final-line">
    <img src="/doodles/d9.png" class="inline-doodle center-doodle">

    <p class="typing-text"
      data-text= "You mean more to me
      than words can ever say. ❤️">
    </p>
  </div>

</div>

    <div class="heart-cluster">
      <span class="side-heart">💕</span>
      <span class="side-heart">🌸</span>
      <span class="side-heart">💕</span>
    </div>

    <p class="footer-line">✨ with all my love, forever & always ✨</p>

  </div>
</div>

<script src="/JS/message.js"></script>
<script src="/JS/global.js"></script>
<script src="/JS/transitions.js"></script>

</body>
</html>
